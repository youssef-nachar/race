<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Controller</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="controller-body">
    
    <div id="join-screen">
        <h2>Enter Room Code</h2>
        <input type="text" id="room-input" placeholder="e.g. RACE-1234">
        <button id="join-btn">JOIN GAME</button>
        <p id="status-msg"></p>
    </div>

    <div id="gamepad" style="display: none;">
        <div class="color-indicator" id="my-color">Your Car</div>
        <div class="controls">
            <div class="steer-buttons">
                <button id="btn-left" class="control-btn">LEFT</button>
                <button id="btn-right" class="control-btn">RIGHT</button>
            </div>
            <div class="action-buttons">
                <button id="btn-accel" class="control-btn accel">ACCEL</button>
                <button id="btn-brake" class="control-btn brake">BRAKE</button>
            </div>
        </div>
    </div>

    <script src="./controller.js"></script>
</body>
</html>
