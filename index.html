<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Screen - Racing Game (No Server)</title>
    <link rel="stylesheet" href="./style.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS for WebRTC (No Backend Required) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>Multiplayer Racing</h1>
        <div id="join-info">
            <p>Scan to join or open <span style="color:yellow;">controller.html</span></p>
            <h2>Room Code: <span id="room-code">Loading...</span></h2>
            <div id="qrcode"></div>
        </div>
        <div id="players-list"></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script src="./game.js"></script>
</body>
</html>
